format_version = 5
id = "psx.enhancement.widescreen"
version = "1.0.0"
name = "Widescreen"
author = "psxrecomp"
description = "Renders the game at a wide aspect. Digimon World has the per-title work done -- nothing is stretched, the backdrop covers the wider view, and HUD pieces the game hides stay hidden -- so this is a real widening rather than the generic experimental tier. Off by default."
resolver = "declarative"
save_compatibility = "shared"

# GAME-OWNED OVERRIDE of the framework's builtin package of the same id.
#
# Why it exists: the builtin offers 16:9, 16:10 and 21:9 to every title
# (mods/builtin/packages/psx.enhancement.widescreen/1.0.0/manifest.toml,
# game_id "*"). This game honours all three, but 21:9 only under a condition
# the builtin cannot state, so the choice list and its text live here.
#
#   The reveal per side is off = (w*(3n-4d) + 4d) / (8d) at w = 320, so
#   16:10 -> 32 px, 16:9 -> 53 px, 21:9 -> 120 px.
#
#   The game streams its backdrop as a ring of FOUR 128-px tile columns =
#   512 px. With the fifth-column sliver (dw_ws_sliver.c) that ring can cover
#   a reveal of about 78 px, so 16:9 and 16:10 work from it alone. 21:9's 560-
#   px view cannot come from 512 px of tiles: it needs the texture-bank
#   backdrop (dw_ws_sliver.c, dw_bank_draw), which draws every tile the view
#   meets from the map's own tile file.
#
#   With an HD texture pack on, bank draws use its replacements too: the
#   plugin declares each bank slot as the tile upload it holds
#   (psx_mod_texture_bank_add_upload), so a replacement keyed on that upload
#   matches in the bank as it does in VRAM. Texture banks are refused on
#   Vulkan, where the frame stays 21:9 and the ring tier runs at its 64-px cap
#   (dw_ws_camera.c DW_MARGIN_MAX).
#
# Nothing wider than 21:9 is offered: only 30 maps fill a 32:9 view.
#
# The plugin id below is the framework's own registration
# (runtime/src/mod_builtin_widescreen.c), which reads this option and calls
# psx_ws_engage_aspect. Only the choice list differs from the builtin.
[[target]]
game_id = "*"

[[feature]]
id = "widescreen"
name = "Widescreen"
description = "Widens the field of view. 3D, menus, text boxes and the HUD all keep their original proportions; the extra width is real extra view on both sides. Two rooms whose art stopped at the original 4:3 edge (the Item Shop and Jijimon's house) come repainted. The smallest rooms are narrower than the wide view; past their edges their own art carries on, mirrored, and fades into black instead of stopping at a hard bar (plain black on Vulkan). Some interiors are drawn floating in black, so their edges stay dark as designed."
group = "Video"
default_enabled = false

[[option]]
feature = "widescreen"
id = "aspect"
label = "Aspect ratio"
description = "16:9 is the tested default. 16:10 reveals a little less. 21:9 (ultrawide) shows the most; 36 small rooms are narrower than the 21:9 view and fade into black at both sides. HD texture packs work at every width, including the extra width at 21:9. Nothing wider than 21:9 is offered."
group = "Video"
type = "choice"
default = "16:9"

[[option.choice]]
value = "16:9"
label = "16:9"

[[option.choice]]
value = "16:10"
label = "16:10"

[[option.choice]]
value = "21:9"
label = "21:9 (ultrawide)"

[[plugin]]
feature = "widescreen"
id = "psx.widescreen"

# The game's own work for this feature. Every plugin id below has to be
# declared here, in the package whose feature it belongs to, because plugin
# callbacks AND function-entry hooks are plan-selected: only ids a manifest
# names are dispatched (build_function_entry_hooks). Exit and replace hooks
# still fire regardless, which is what makes an omission easy to miss -- a
# missing id silently never runs while the rest of the feature keeps working.
#
# dw.ws.btl-bars: holds the battle HP/MP bars' PARKED slide position out past
# the widened frame. See dw_ws_backdrop.c, dw_btl_bars_vblank.
[[plugin]]
feature = "widescreen"
id = "dw.ws.btl-bars"

# Entry hooks in dw_ws_backdrop.c: keep the pre-rendered backdrop tiles and
# map objects registered with the squashed 3D and stretch the full-screen fade
# (setPosDataPolyFT4), and park the HUD and clock needle at the widened edges.
[[plugin]]
feature = "widescreen"
id = "dw.ws.backdrop-align"

[[plugin]]
feature = "widescreen"
id = "dw.ws.hud-park"

# Entry hook in dw_ws_camera.c: handleTileUpdate sees CAMERA_X shifted by the
# reveal, so the backdrop tile ring covers the widened left edge; its exit
# hook restores CAMERA_X.
[[plugin]]
feature = "widescreen"
id = "dw.ws.tile-ladder"

# Entry hooks in dw_ws_camera.c: tickCameraFollowPlayer re-applies the widened
# clamp and the load-time nudge every field frame (and centres narrow maps);
# isOffScreen widens the 4:3 visibility test so characters and boxes stay
# drawn in the reveal.
[[plugin]]
feature = "widescreen"
id = "dw.ws.camera-follow"

[[plugin]]
feature = "widescreen"
id = "dw.ws.cull"

# dw_ws_sliver.c: readMapTFS entry hook and savestate callback keeping a host
# copy of the map's tile file, read from disc, for the fifth-column sliver.
[[plugin]]
feature = "widescreen"
id = "dw.ws.sliver"

# dw_ws_world.c: activation, VBlank and savestate callbacks for the world-scene
# predicate that keeps a field frame wide through a synchronous tile reload.
[[plugin]]
feature = "widescreen"
id = "dw.ws.world"

# dw_ws_backdrop.c: GsDrawOt entry hook widening every full-screen plate
# (pause, battle flashes, STD/VS/MURD/EAB) to the presented width.
[[plugin]]
feature = "widescreen"
id = "dw.ws.plates"

# dw_ws_weather.c: snow and mist copies into the reveals (exit hooks on
# buildSnowflakePrim, renderMist and renderMap, plus a savestate callback).
[[plugin]]
feature = "widescreen"
id = "dw.ws.weather"

# >>> extended backdrops: generated by tools/gen_extended_backdrops.py, do not hand-edit
#
# Rooms pre-rendered only as far as the 4:3 camera could see, repainted so
# the widened view shows the room instead of a black strip. Part of the
# widescreen feature itself, so choosing widescreen is all a player does.
# Source art: art/backdrops/*.png (each map's own CLUT indices).

