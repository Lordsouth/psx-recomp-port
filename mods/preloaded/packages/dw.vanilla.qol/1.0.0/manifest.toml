[[patch]]
feature = "longer-life"
target = "main_exe"
address = 0x800DEC84
expected = "68 01 02 24"
replace_from = { option = "hours", encoding = "u16le", offset = 0 }

# tickGameClock: andi $a0,$v0,0xFF -> addiu $a0,$zero,2 (Half speed (relaxed))
[[patch]]
feature = "clock-speed"
target = "main_exe"
address = 0x800DD008
expected = "ff 00 44 30"
replace = "02 00 04 24"
when = { speed = "half" }

# tickGameClock: andi $a0,$v0,0xFF -> addiu $a0,$zero,1 (Double speed)
[[patch]]
feature = "clock-speed"
target = "main_exe"
address = 0x800DD008
expected = "ff 00 44 30"
replace = "01 00 04 24"
when = { speed = "double" }

