[[feature]]
id = "end-box-fix"
name = "Battle End Freeze Fix"
description = "Fixes a bug in the original game. A battle freezes on its results when the win lifts your partner's Brains past 700, 800, 900 or 999, and everything since your last save is lost. With this on, the game shows its MP bonus message and carries on."
group = "Fixes"
default_enabled = true

