target = "main_exe"
address = 0x80100FFC
expected = "80 00 02 36"
replace = "00 00 02 36"
when = { speed = "instant" }

# scriptSetTextboxSize: ori $v0,$s0,0x80 -> ori $v0,$s0,0 -- same, for script-sized boxes
[[patch]]
feature = "text-speed"
target = "main_exe"
address = 0x80101E20
expected = "80 00 02 36"
replace = "00 00 02 36"
when = { speed = "instant" }

# setupNewGameDialogueBox: addiu $a1,$zero,0x81 -> 0x01 -- same, for Jijimon's NEW GAME interview
[[patch]]
feature = "text-speed"
target = "main_exe"
address = 0x80109C98
expected = "81 00 05 24"
replace = "01 00 05 24"
when = { speed = "instant" }

[[feature]]
id = "walk-speed"
name = "Run Speed"
description = "Your tamer runs faster in the field. Collisions, map exits, doors and talking to Digimon work as normal, and walking (hold R1), menus and cutscenes stay at normal speed. Your partner keeps its own pace, so on a long run it falls well behind and takes a few seconds to catch up after you stop. A map exit puts it back beside you."
group = "Field"
default_enabled = false

[[option]]
feature = "walk-speed"
id = "speed"
label = "Run speed"
description = "1.5x adds a step every other frame, 2x every frame."
group = "Field"
type = "choice"
default = "1.5x"

[[option.choice]]
value = "1.5x"
label = "1.5x"

[[option.choice]]
value = "2x"
label = "2x"

