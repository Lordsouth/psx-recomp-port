expected = "68 01 02 24"
replace_from = { option = "hours", encoding = "u16le", offset = 0 }

# tickGameClock: andi $a0,$v0,0xFF -> addiu $a0,$zero,2 (Half speed (relaxed))
[[patch]]
feature = "clock-speed"
target = "main_exe"
address = 0x800DD008
expected = "ff 00 44 30"
replace = "02 00 04 24"
when = { speed = "half" }

# tickGameClock: andi $a0,$v0,0xFF -> addiu $a0,$zero,1 (Double speed)
[[patch]]
feature = "clock-speed"
target = "main_exe"
address = 0x800DD008
expected = "ff 00 44 30"
replace = "01 00 04 24"
when = { speed = "double" }

[[feature]]
id = "save-anywhere"
name = "Save Anywhere"
description = "Save from the field menu at any time. Pick Sleep while your partner is not sleepy (no ZZZ bubble) and the game's own 'Do you want to save?' prompt opens; Sleep no longer looks greyed out. Nothing sleeps: no time skip, no tiredness, lifespan or care changes, and the clock stays stopped while the menu is open. When your partner is sleepy, Sleep works as before."
group = "Saving"
default_enabled = false

