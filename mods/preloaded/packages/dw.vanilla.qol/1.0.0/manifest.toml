[[feature]]
id = "text-speed"
name = "Text Speed"
description = "Dialogue pages appear without the wait. The stock game draws a page one line per frame and only then zooms the box out of the speaker; Fast draws the whole page at once, Instant also opens the box without the zoom. Scripted pauses are unchanged, but text that does not wait for a button moves on a moment sooner, and with Instant a mashed X can skip a page."
group = "Quality of Life"
default_enabled = false

[[option]]
feature = "text-speed"
id = "speed"
label = "Text speed"
description = "Fast draws each page in one frame instead of one line per frame; the box still zooms out of the speaker. Instant also opens dialogue boxes without the zoom (or its sound). Turn the feature off for the stock speed."
group = "Quality of Life"
type = "choice"
default = "instant"

[[option.choice]]
value = "fast"
label = "Fast"

[[option.choice]]
value = "instant"
label = "Instant"

# drawTextboxStrings: addiu $v0,$zero,1 -- lines drawn per tick for a full-width box (vramMode 0, every dialogue box)
[[patch]]
feature = "text-speed"
target = "main_exe"
address = 0x800FFB10
expected = "01 00 02 24"
replace = "10 00 02 24"

# setupDialogueBox: ori $v0,$s0,0x80 -> ori $v0,$s0,0 -- script dialogue box opens static instead of zooming from the speaker
[[patch]]
