# Digimon World - Quality of Life. Generated by tools/gen_qol_mods.py;
# regenerate rather than hand-editing so every guard stays byte-exact.

format_version = 5
id = "dw.vanilla.qol"
version = "1.0.0"
name = "Quality of Life"
author = "DigimonWorldRecomp"
description = "Difficulty knobs for the raising sim: how long your partner lives, and how fast the world clock runs. Both are off by default and neither disables a mechanic -- they retune it."
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "SLUS-01032"

[[feature]]
id = "longer-life"
name = "Longer Life"
description = "Sets how many in-game hours a Digimon lives. Stock is 360 hours (15 in-game days), which is why partners so often die of old age mid-playthrough. Raising this does not touch anything else: illness, care mistakes and battle losses still cost lifespan exactly as before."
group = "Raising"
default_enabled = false

[[option]]
feature = "longer-life"
id = "hours"
label = "Lifespan (in-game hours)"
description = "360 is stock. 720 doubles it, 1800 is five times. The ceiling is 9999 because the game stores lifespan in a signed 16-bit field and loads it with a sign-extending instruction."
group = "Raising"
type = "integer"
min = 1
max = 9999
step = 1
default = 360

[[feature]]
id = "clock-speed"
name = "World Clock Speed"
description = "Pins the game clock to a speed the game itself supports. Half speed is the relaxed setting: a day takes twice as long in real time, so hunger, tiredness, pooping, evolution timers and ageing all slow together and no ratio between them changes."
group = "Raising"
default_enabled = false

[[option]]
feature = "clock-speed"
id = "speed"
label = "Clock speed"
description = "Pause is not offered: the game resets that state while time is running, so it would fight itself."
group = "Raising"
type = "choice"
default = "half"

[[option.choice]]
value = "half"
label = "Half speed (relaxed)"

[[option.choice]]
value = "double"
label = "Double speed"

# addiu $v0, $zero, 360 -> lifespan immediate; stores to
# PARTNER_PARA.remainingLifetime (0x801384A8) on the next instruction.
[[patch]]
feature = "longer-life"
target = "main_exe"
address = 0x800A45AC
expected = "68 01 02 24"
replace_from = { option = "hours", encoding = "u16le", offset = 0 }

# addiu $v0, $zero, 360 -> lifespan immediate; stores to
