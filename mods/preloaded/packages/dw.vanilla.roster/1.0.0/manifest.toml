# Digimon World - Expanded Roster. Generated by
# tools/gen_roster_mod.py; regenerate rather than hand-editing.

format_version = 13
id = "dw.vanilla.roster"
version = "1.0.0"
name = "Expanded Roster"
author = "DigimonWorldVanilla"
description = "Grows every type-indexed partner table beyond its stock size, then makes 52 Digimon raisable: 51 that shipped on the disc as enemies only, with finished models, animations, textures, voices and battle auras the game never let you raise, plus Machinedramon in the one unused slot. Sixteen new Rookies, twenty-three new Champions, six new Ultimates. Powered by table relocation into enhancement memory."
resolver = "declarative"
save_compatibility = "isolated"

[[target]]
game_id = "SLUS-01032"

[[feature]]
id = "roster"
name = "52 new raisable Digimon"
description = "Relocates and grows all eight type-indexed partner tables, then authors 51 species into the headroom: model, skeleton, battle auras, stats, training animations and an evolution path for each. Weight still decides, and the classic evolutions still happen exactly as they always did. The touched functions run interpreted until the background compiler rebuilds them natively."
group = "Roster"
default_enabled = false

# The native side: dw_roster.c's activation reserves the arena and its
# boot hook fills it. Activation only fires for manifest-selected ids.
[[plugin]]
feature = "roster"
id = "dw.roster"

