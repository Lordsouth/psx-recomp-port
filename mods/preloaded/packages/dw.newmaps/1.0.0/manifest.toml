# New maps. Generated by tools/gen_newmap.py: regenerate rather than hand-editing, so every guard stays
# byte-exact. assets/ is this port's own map and art (no game art or data); regenerating means updating
# MOD_PAYLOADS in tools/verify_setup_package.py. Isolated keeps savestates from crossing into a plan
# without the map; memory cards stay shared, because dw_newmaps.c keeps the new row off them.
format_version = 13
id = "dw.newmaps"
version = "1.0.0"
name = "New Maps"
author = "DigimonWorldRecomp"
description = "Maps the original game never had, built from this port's own art and collision. No game data is in this package."
resolver = "declarative"
save_compatibility = "isolated"

[[target]]
game_id = "SLUS-01032"
disc_sha256 = "06084490ea0db34099b31495ccba4ec18fb0ff25c7683c508e9d2db93d4495f4"

[[feature]]
id = "glade"
name = "Hidden Glade"
description = "A new map to explore: a quiet forest glade with a pond, painted for this port, and something strong waiting at the end of the path. Find it in Native Forest, on the screen where Palmon waits: walk north through the gap in the bushes at the top right. A save made inside resumes just outside it, so your cards stay safe with this off. Needs the exact disc image listed in DISC.md. Works with Digimon World 1.5 too: there it runs a 1.5 edition by itself."
group = "New maps"
default_enabled = false
conflicts = ["dw.newmaps.spike/spike"]

# dw_newmaps.c: a save made on the new map names its host instead.
[[plugin]]
feature = "glade"
id = "dw.newmaps"

# our glade.map in MGEN17's sectors
[[overlay]]
feature = "glade"
target = "disc_user"
offset = 81375232
file = "assets/glade.map"
sha256 = "858369ce8d5e3def667db4306889673d0e40a48a1b31a7af1c0b51a302519b74"

# our glade.tfs in MGEN17's sectors
[[overlay]]
feature = "glade"
target = "disc_user"
offset = 81463296
file = "assets/glade.tfs"
sha256 = "11a3c9fbf3743f9452f9808266dbe524477924b120ec23f4008bf15288a130d8"

# DG script 118: the arrival END, plus the boss's section
[[overlay]]
