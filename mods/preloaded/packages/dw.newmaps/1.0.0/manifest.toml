name = "Hidden Glade (1.5)"
description = "Hidden Glade on Digimon World 1.5: the same map and fight, written where 1.5 keeps the files it moved. It runs by itself in place of Hidden Glade while 1.5 is on."
group = "New maps"
default_enabled = false
hidden = true
edition_of = "dw.newmaps/glade"
conflicts = ["dw.newmaps.spike/spike"]

