# GENERATED by tools/gen_cheats_mod.py from cheats.txt -- do not hand-edit.
#
# One boolean option per cheat. The option does NOT carry the code: the
# plugin calls psx_mod_cheat_set_enabled() with the cheat's name and the
# runtime's own engine applies whatever cheats.txt says that name writes.
# So this manifest can never disagree with the file about an address --
# it does not contain one. Regenerate after editing cheats.txt.
format_version = 5
id = "dw.vanilla.cheats"
version = "1.0.0"
name = "Cheats"
author = "DigimonWorldVanilla"
description = "The 57 GameShark-style codes from cheats.txt, as toggles. Turning this feature on hands control of every cheat to the launcher; leave it off and cheats.txt keeps deciding, exactly as before."
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "SLUS-01032"

[[feature]]
id = "cheats"
name = "Cheats"
description = "Pick cheats here instead of editing cheats.txt. These are per-frame memory pokes like a real GameShark, so several write things the game saves to your memory card -- back it up first. Where a cheat and another mod touch the same thing, the cheat wins."
group = "Cheats"
default_enabled = false

[[plugin]]
feature = "cheats"
id = "dw.cheats"

