# The Abandoned Factory. Generated by tools/gen_factory.py: regenerate rather than hand-editing, so every guard
# stays byte-exact. assets/ is this port's own maps and scripts (no game art or data); regenerating means updating
# MOD_PAYLOADS in tools/verify_setup_package.py.
format_version = 13
id = "dw.newmaps.factory"
version = "1.0.0"
name = "New Maps: Abandoned Factory"
author = "DigimonWorldRecomp"
description = "A new area of four screens the original game never had, built from this port's own art and collision. No game data is in this package."
resolver = "declarative"
save_compatibility = "isolated"

[[target]]
game_id = "SLUS-01032"
disc_sha256 = "06084490ea0db34099b31495ccba4ec18fb0ff25c7683c508e9d2db93d4495f4"

[[feature]]
id = "factory"
name = "Abandoned Factory"
description = "A new area to explore: an abandoned factory of four screens whose machines still run. Find it in Gear Savanna, on the screen with the signs and the campfire: walk east past the bucket, between the camp and the boulders. Needs the exact disc image listed in DISC.md. Not for Digimon World 1.5 yet."
group = "New maps"
default_enabled = false
conflicts = ["dw.1_5/dw15"]

# dw_newmaps.c: serves the screens' file names (dw_newmaps_files.inc) to the game's file lookup.
[[plugin]]
feature = "factory"
id = "dw.newmaps.factory"

