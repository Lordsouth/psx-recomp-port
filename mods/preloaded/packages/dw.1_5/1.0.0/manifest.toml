# Digimon World 1.5 (Test Build 1.3.1) by Capablemite, as a Mods-panel toggle.
#
# The player keeps their stock disc. With the feature on, the runtime checks
# that disc against source_sha256, applies the author's own BPS in memory and
# serves the result (hash-checked against target_sha256) in place of the stock
# sectors -- the executable, ten overlays and the data 1.5 adds past the end of
# the disc. Nothing is written to the player's disc.
#
# Features that cannot run on 1.5's executable and overlays are listed by
# tools/check_dw15_compat.py; rerun it whenever a manifest or game.toml hook
# changes, or when a new test build replaces the BPS.

format_version = 12
id = "dw.1_5"
version = "1.0.0"
name = "Digimon World 1.5 (Test Build 1.3.1)"
author = "Capablemite"
description = "Digimon World 1.5 by Capablemite: Digimon from Adventure 02 and Tamers on File Island. Four new partner lines (Veemon, Wormmon, Renamon, Guilmon), new eggs, new special attacks, a four-page Digivolution Chart and a second Tech page. A public test build."
resolver = "declarative"
save_compatibility = "isolated"

[[target]]
game_id = "SLUS-01032"

[[feature]]
id = "dw15"
name = "Digimon World 1.5 (Test Build 1.3.1)"
description = "Plays Capablemite's Digimon World 1.5 test build on your own disc. Start a new game: old saves may not work, so 1.5 keeps its own memory cards (saves/dw15) and your normal saves are untouched. Turns off Expanded Roster (same Digimon slots), Evolution Unbound, Guaranteed Item Drops and the Native Evolution Engine, which edit parts of the game 1.5 rewrote. Other mods and widescreen still work."
group = "Total conversion"
default_enabled = false
# Every feature tools/check_dw15_compat.py reports. Ticking 1.5 turns these
# off; ticking one of them turns 1.5 off.
conflicts = [
  "dw.vanilla.roster/roster",
  "dw.vanilla.evolution/native-evolution",
  "dw.vanilla.gameplay/evolution-unbound",
  "dw.vanilla.trainer/guaranteed-drops",
]

# The author's patch, unchanged. Applied to the player's verified stock disc.
[[disc_delta]]
feature = "dw15"
format = "bps"
file = "assets/digimon_world_1_5_test1.bps"
source_sha256 = "06084490ea0db34099b31495ccba4ec18fb0ff25c7683c508e9d2db93d4495f4"
target_sha256 = "c51099d7b2cf44401eca5a54f7838f85205bccfff207b72dc2de7675ec6b8826"

# dw_dw15.c: moves the memory cards to saves/dw15/ while this is on.
[[plugin]]
feature = "dw15"
id = "dw.dw15"
