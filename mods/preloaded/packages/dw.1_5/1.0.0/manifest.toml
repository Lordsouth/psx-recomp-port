[[feature]]
id = "dw15-evolution-unbound"
name = "Evolution Unbound (1.5)"
description = "Scales the six stat walls each evolution demands in Digimon World 1.5: HP, MP, Offense, Defense, Speed and Brain, for every evolution the game can choose, the new lines included. Care mistakes, weight, discipline, happiness and battle/tech counts are left alone, as in Evolution Unbound. Needs Digimon World 1.5 and turns it on."
group = "Gameplay"
default_enabled = false

# Patches below sit in files only the 1.5 delta serves.
[[constraint]]
feature = "dw15-evolution-unbound"
kind = "requires_feature"
requires_feature = "dw15"

[[option]]
feature = "dw15-evolution-unbound"
id = "walls"
label = "Stat requirements"
group = "Gameplay"
type = "choice"
default = "relaxed"

[[option.choice]]
value = "vanilla"
label = "Vanilla"

[[option.choice]]
value = "relaxed"
label = "Relaxed (75%)"

[[option.choice]]
value = "open"
label = "Open (50%)"

# EVOLUTION_REQS[row] stat walls (row*28 + 2 hp .. + 12 brain), each
# written in 1.5's SLUS_010.32 staged copy (boot; disc_user 349755392 + 0x20)
# and in MODTBL.BIN (reloads; disc_user 345049088 + 0x20).
# Placeholder target rows skipped (walls 32767): 254

