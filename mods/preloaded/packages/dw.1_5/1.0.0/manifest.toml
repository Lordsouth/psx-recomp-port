# Battle End Freeze Fix, part of 1.5 here: docs/GAME.md 12.1

# BTL_REL.BIN 0x80062D58: the MP bonus text has 2 rows, not 4: addi $v0,$v0,2
[[patch]]
feature = "dw15"
target = "disc_user"
offset = 302561912
expected = "04 00 42 20"
replace = "02 00 42 20"

# BTL_REL.BIN 0x80062EC8: the reader stops at the end of the text, not on the digit 0: addiu $at,$zero,0
[[patch]]
feature = "dw15"
target = "disc_user"
offset = 302562280
expected = "30 00 01 24"
replace = "00 00 01 24"

# BTL_REL.BIN 0x80072FC2: a first line that fits the box, and a row break
[[patch]]
feature = "dw15"
target = "disc_user"
offset = 302628066
expected = "43 6f 6e 73 75 6d 70 74 69 6f 6e 20 42 6f 6e 75 73 21 00"
replace = "43 6f 73 74 20 42 6f 6e 75 73 21 23 52 00 00 00 00 00 00"

