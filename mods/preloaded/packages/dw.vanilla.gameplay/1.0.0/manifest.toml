# Digimon World - Gameplay. Generated by tools/gen_gameplay_mods.py;
# regenerate rather than hand-editing so every guard stays byte-exact.

format_version = 5
id = "dw.vanilla.gameplay"
version = "1.0.0"
name = "Gameplay"
author = "DigimonWorldRecomp"
description = "Retunes the two systems that define Digimon World: how techniques are learned, and how high the evolution stat walls are. Both default to vanilla."
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "SLUS-01032"

[[feature]]
id = "tech-mastery"
name = "Tech Mastery"
description = "Techniques are learned by winning battles and passing a hidden roll against a per-move chance table, so most fights teach nothing. This scales that roll. It cannot teach a Digimon a move it could never learn -- the candidate list is still filtered by species and slot first."
group = "Gameplay"
default_enabled = false

[[option]]
feature = "tech-mastery"
id = "odds"
label = "Learning odds"
group = "Gameplay"
type = "choice"
default = "boosted"

[[option.choice]]
value = "normal"
label = "Normal (vanilla)"

[[option.choice]]
value = "boosted"
label = "Boosted (about 2x)"

[[option.choice]]
value = "guaranteed"
label = "Guaranteed"

[[feature]]
id = "evolution-unbound"
name = "Evolution Unbound"
description = "Scales the six stat walls each evolution demands: HP, MP, Offense, Defense, Speed and Brain. Care mistakes, weight, discipline, happiness and battle/tech counts are deliberately left alone -- weight is an exact target rather than a floor, so scaling it would make evolutions unreachable instead of easier."
group = "Gameplay"
default_enabled = false

[[option]]
feature = "evolution-unbound"
id = "walls"
label = "Stat requirements"
group = "Gameplay"
type = "choice"
default = "relaxed"

[[option.choice]]
value = "vanilla"
label = "Vanilla"

[[option.choice]]
value = "relaxed"
label = "Relaxed (75%)"

[[option.choice]]
value = "open"
label = "Open (50%)"

# battleMoveLearning: random(100) -> random(50)  [Boosted (about 2x)]
[[patch]]
feature = "tech-mastery"
target = "main_exe"
address = 0x800ED528
expected = "64 00 04 24"
replace = "32 00 04 24"
when = { odds = "boosted" }

# battleMoveLearning: random(100) -> random(1)  [Guaranteed]
[[patch]]
feature = "tech-mastery"
target = "main_exe"
address = 0x800ED528
expected = "64 00 04 24"
replace = "01 00 04 24"
when = { odds = "guaranteed" }

