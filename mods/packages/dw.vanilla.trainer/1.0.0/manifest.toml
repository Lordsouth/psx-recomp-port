# Digimon World Trainer -- generated by tools/gen_trainer.py.
# Do not hand-edit: regenerate so every `expected` guard stays
# byte-exact against game/extracted/SLUS_010.32.
#
# Toggle features in the launcher's Mods panel.

format_version = 5
id = "dw.vanilla.trainer"
version = "1.0.0"
name = "Digimon World Trainer"
author = "DigimonWorldRecomp"
description = "Turn off the raise-sim pressures that end runs: hunger, tiredness, illness, lifespan drain and death, plus a battle stat-gain tuner. Every toggle is independent and off by default."
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "SLUS-01032"

[[feature]]
id = "no-hunger"
name = "No Hunger"
description = "Your Digimon never gets hungry, so the food gauge stops draining and it never starves. Feeding still works normally."
group = "Care"
default_enabled = false

[[feature]]
id = "no-tiredness"
name = "No Tiredness"
description = "The tiredness gauge stops rising, so your Digimon never needs to rest and never collapses from exhaustion."
group = "Care"
default_enabled = false

[[feature]]
id = "never-sick"
name = "Never Get Sick"
description = "Illness never develops, so your Digimon cannot catch the sickness that normally follows poor care or bad food."
group = "Care"
default_enabled = false

[[feature]]
id = "never-unhappy"
name = "Never Unhappy"
description = "Happiness stops decaying, so your Digimon will not sulk, disobey, or wander off from unhappiness."
group = "Care"
default_enabled = false

[[feature]]
id = "no-death"
name = "No Death (Immortal)"
description = "The death check never runs, so your Digimon will not die of old age, neglect, or anything else. The single biggest source of lost runs."
group = "Lifespan"
default_enabled = false

[[feature]]
id = "no-lifespan-sickness"
name = "No Lifespan Loss from Sickness"
description = "Being sick no longer burns days off your Digimon's lifespan."
group = "Lifespan"
default_enabled = false

[[feature]]
id = "no-lifespan-battle"
name = "No Lifespan Loss from Battles"
description = "Losing battles no longer burns days off your Digimon's lifespan."
group = "Lifespan"
default_enabled = false

[[feature]]
id = "no-battle-fatigue"
name = "No Post-Battle Tiredness"
description = "Fighting no longer adds tiredness, so you can battle back to back without resting."
group = "Battle"
default_enabled = false

[[feature]]
id = "no-pooping"
name = "No Pooping"
description = "Your Digimon never needs to poop, so no mess accumulates and no care mistakes are logged for leaving it."
group = "Housekeeping"
default_enabled = false

[[feature]]
id = "no-poop-weight-loss"
name = "No Weight Loss from Pooping"
description = "Pooping no longer reduces weight, making it much easier to hold a weight target for evolution requirements."
group = "Housekeeping"
default_enabled = false

[[feature]]
id = "battle-stat-gain"
name = "Battle Stat Gain"
description = "Scales the stats your Digimon earns from winning a battle. Each slider applies when fighting that many enemies at once. Defaults are this disc's stock values, so enabling the feature changes nothing until you raise one."
group = "Training"
default_enabled = false

[[option]]
feature = "battle-stat-gain"
id = "gain-1"
label = "Stat gain vs 1 enemy"
description = "Stock value on this disc is 10. Higher means faster growth; 127 is the largest value the game field holds."
group = "Training"
type = "integer"
min = 1
max = 127
step = 1
default = 10

[[option]]
feature = "battle-stat-gain"
id = "gain-2"
label = "Stat gain vs 2 enemies"
description = "Stock value on this disc is 12. Higher means faster growth; 127 is the largest value the game field holds."
group = "Training"
type = "integer"
min = 1
max = 127
step = 1
default = 12

[[option]]
feature = "battle-stat-gain"
id = "gain-3"
label = "Stat gain vs 3 enemies"
description = "Stock value on this disc is 16. Higher means faster growth; 127 is the largest value the game field holds."
group = "Training"
type = "integer"
min = 1
max = 127
step = 1
default = 16

