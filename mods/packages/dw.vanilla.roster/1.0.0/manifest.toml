format_version = 5
id = "dw.vanilla.roster"
version = "1.0.0"
name = "Expanded Roster"
author = "DigimonWorldVanilla"
description = "Grows the partner-line tables beyond their stock sizes and completes the game one unused Digimon slot: Machinedramon becomes a legitimate, raisable partner with a real evolution requirement. Powered by table relocation into enhancement memory."
resolver = "declarative"
save_compatibility = "isolated"

[[target]]
game_id = "SLUS-01032"

[[feature]]
id = "roster"
name = "Machinedramon (new raisable Digimon)"
description = "Relocates and grows the evolution-requirement, raise and evolution-gain tables, then wires slot 114 as Machinedramon: model, skeleton, battle auras, stats and an evolution path. The touched functions run interpreted until the background compiler rebuilds them natively."
group = "Roster"
default_enabled = false

# The native side: dw_roster.c's activation reserves the arena and its
# boot hook fills it. Activation only fires for manifest-selected ids.
[[plugin]]
feature = "roster"
id = "dw.roster"

